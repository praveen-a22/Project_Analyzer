<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Projects — Project Analyzer</title>

  <!-- CDNs -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="d-flex align-items-center gap-2 text-decoration-none">
          <div class="brand-icon">
            <i class="bi bi-cpu-fill"></i>
          </div>
          <span class="brand-name">PROJECT ANALYZER</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Main Navigation</div>
        <a href="dashboard.html" class="sidebar-link">
          <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <a href="projects.html" class="sidebar-link active">
          <i class="bi bi-folder-fill"></i> Projects
        </a>
        <a href="analysis.html" class="sidebar-link">
          <i class="bi bi-activity"></i> Analysis
        </a>
        <a href="issues.html" class="sidebar-link">
          <i class="bi bi-exclamation-triangle-fill"></i> Code Issues
        </a>
        <a href="dependencies.html" class="sidebar-link">
          <i class="bi bi-diagram-3-fill"></i> Dependencies
        </a>
        <a href="architecture.html" class="sidebar-link">
          <i class="bi bi-layers-fill"></i> Architecture
        </a>
        <a href="testing.html" class="sidebar-link">
          <i class="bi bi-check-circle-fill"></i> Testing & Coverage
        </a>
        <a href="reports.html" class="sidebar-link">
          <i class="bi bi-file-earmark-bar-graph-fill"></i> Reports
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="settings.html" class="sidebar-link">
          <i class="bi bi-gear-fill"></i> Settings
        </a>
        <a href="login.html" class="sidebar-link text-danger">
          <i class="bi bi-box-arrow-left"></i> Logout
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Top Navbar -->
      <header class="app-header">
        <button id="mobileNavToggle" class="btn btn-icon btn-secondary-custom d-none" aria-label="Toggle Navigation">
          <i class="bi bi-list fs-4"></i>
        </button>

        <div class="header-search">
          <i class="bi bi-search"></i>
          <input type="text" id="projectSearchInput" class="form-control form-control-custom" placeholder="Search projects by name, stack, description...">
        </div>

        <div class="header-actions">
          <div class="avatar">PK</div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content">
        <!-- Page Header -->
        <div class="page-header-row">
          <div>
            <h1 class="page-title">My Projects</h1>
            <p class="page-subtitle">Manage, inspect, and run static code analysis across all codebases.</p>
          </div>
          <a href="new-project.html" class="btn btn-primary-custom">
            <i class="bi bi-plus-lg"></i> New Project
          </a>
        </div>

        <!-- Filter Bar -->
        <div class="card-custom p-3 mb-4">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="d-flex gap-2">
              <button class="btn btn-primary-custom btn-sm project-filter-tab active" data-filter="all">All Projects</button>
              <button class="btn btn-secondary-custom btn-sm project-filter-tab" data-filter="healthy">Healthy</button>
              <button class="btn btn-secondary-custom btn-sm project-filter-tab" data-filter="warning">Warning</button>
              <button class="btn btn-secondary-custom btn-sm project-filter-tab" data-filter="critical">Critical</button>
            </div>
            <span class="text-muted small">Showing all active codebases</span>
          </div>
        </div>

        <!-- Projects Grid Container -->
        <div class="row" id="projectsContainer">
          <!-- Populated dynamically via js/projects.js -->
        </div>
      </div>
    </main>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/api-service.js"></script>
  <script src="../js/projects.js"></script>
</body>
</html>
