<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Project Analyzer</title>

  <!-- CDNs -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-primary-theme min-vh-100 d-flex align-items-center justify-content-center py-5 position-relative overflow-hidden">

  <!-- Developer Theme Background Grid Accent -->
  <div style="position: absolute; top: -100px; left: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%); pointer-events: none;"></div>
  <div style="position: absolute; bottom: -100px; right: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0,0,0,0) 70%); pointer-events: none;"></div>

  <div class="container position-relative" style="max-width: 440px;">
    <!-- Logo -->
    <div class="text-center mb-4">
      <a href="../index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
        <div class="brand-icon" style="width:44px; height:44px; font-size:1.3rem;">
          <i class="bi bi-cpu-fill"></i>
        </div>
        <span class="brand-name fs-4">PROJECT ANALYZER</span>
      </a>
      <p class="text-secondary small mt-2">Welcome back! Sign in to access your developer portal.</p>
    </div>

    <!-- Login Card -->
    <div class="card-custom p-4 p-md-5">
      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label for="loginEmail" class="form-label text-secondary small fw-bold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-input border-secondary text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" id="loginEmail" class="form-control form-control-custom" placeholder="developer@company.com" required value="praveen@analyzer.io">
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="loginPassword" class="form-label text-secondary small fw-bold mb-0">Password</label>
            <a href="#" class="small text-accent" onclick="showToast('Password Reset', 'Reset link sent to email.', 'info')">Forgot password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-input border-secondary text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" id="loginPassword" class="form-control form-control-custom" placeholder="••••••••" required value="Password123!">
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input bg-input border-secondary" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label text-secondary small" for="rememberMe">
            Remember me on this device
          </label>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </form>
    </div>

    <!-- Bottom Link -->
    <div class="text-center mt-4">
      <span class="text-secondary small">Don't have an account?</span>
      <a href="register.html" class="small fw-bold text-accent ms-1">Create one</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      showToast("Authenticated", "Welcome back, Praveen!", "success");
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 600);
    }
  </script>
</body>
</html>
